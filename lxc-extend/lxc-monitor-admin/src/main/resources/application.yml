server:
  port: 9200
spring:
  application:
    name: lxc-monitor-admin
  profiles:
    active: @profiles.active@

--- # 监控中心服务端配置
spring:
  security:
    user:
      name: lxc
      password: lxclxc
  boot:
    admin:
      ui:
        title: lxc-Vue-Plus服务监控中心
      context-path: /monitor/admin

--- # Actuator 监控端点的配置项
management:
  health:
    db:
      enabled: true
      timeout: 5s
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/lxc-monitor-admin.log


--- # 监控配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: true
  # 设置 Spring Boot Admin Server 地址
  url: http://localhost:9090/monitor/admin
#  url: http://94.154.37.20:9090/monitor/admin
  instance:
    service-host-type: IP
  username: lxc
  password: lxclxc
